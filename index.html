<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Check List Mate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F4EFE6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --oscuro: #F0287E; --claro: #F898B8; color-scheme: light only; --paper: #F4EFE6; --ink: #5E5A52; --soft: #A39E94; --line: #8E887C; --rule: #DCD4C6; --ring: #9C978C; --accent: #B9A88E; --hole: #DDD6C8; --lapiz-on: #E6DCCB; --btn: #EAE2D4; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* La hoja no se selecciona al deslizar; los campos de texto sí */
  #sheet, #sheet * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #sheet input, #sheet .edit-input { -webkit-user-select: text; user-select: text; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  body { font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  #sheet { position: relative; height: 100vh; height: 100dvh; background: var(--paper); overflow-x: hidden; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }

  /* ---------- Entrada: el logo aparece de a poco; tocando la pantalla se entra ---------- */
  #intro { position: fixed; inset: 0; z-index: 20; background: #F5EFEA; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #intro img { width: min(93vw, 450px); height: auto; opacity: 0; animation: aparece 1.1s ease forwards; }
  #intro .entrar { position: absolute; bottom: 14vh; left: 0; right: 0; text-align: center; color: var(--claro); font-size: 16px; font-weight: 700; letter-spacing: .5px; opacity: 0; animation: aparece 1s ease 1s forwards; }
  @keyframes aparece { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Cabecera ---------- */
  header { pointer-events: auto; touch-action: pan-y; position: relative; z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 28px 12px 8px; }
  .fecha { text-align: center; flex: 1; }
  .fecha .dia { font-size: 23px; font-weight: 700; color: var(--claro); }
  .fecha .mes { font-size: 15px; color: var(--claro); letter-spacing: .5px; }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 42px; padding-top: 12px; }
  .col.flechas { gap: 2px; }
  .ico, .nav { pointer-events: auto; }
  .ico { width: 42px; height: 42px; border: 0; border-radius: 50%; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .ico:active { color: var(--claro); }
  .ico.abierto { color: var(--claro); }
  #fotoBtn, #palBtn { position: relative; overflow: hidden; background: #E9E0D2; border-radius: 10px; color: var(--oscuro); }
  #fotoIn { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
  .ico#prev, .ico#next { color: var(--oscuro); }
  .ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Paleta ---------- */
  .paleta { position: fixed; top: 130px; right: 12px; z-index: 30; background: #FFFFFF; border: 1.5px solid #DCD4C6; border-radius: 14px; padding: 12px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.12); display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #5E5A52; }
  .opcion { display: flex; width: 120px; height: 34px; border: 0; border-radius: 10px; overflow: hidden; padding: 0; cursor: pointer; opacity: .42; transition: opacity .2s; }
  .opcion.sel { opacity: 1; }
  .opcion span { flex: 1; }

  /* ---------- Fotos ---------- */
  #fotos { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .foto { position: absolute; pointer-events: auto; touch-action: none; cursor: move; }
  .foto img { width: 100%; height: auto; display: block; background: #FFFFFF; padding: 5px; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.18); user-select: none; -webkit-user-drag: none; }
  .foto .quitar { display: none; position: absolute; top: -10px; right: -10px; width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--ink); color: #FFFFFF; font: inherit; font-size: 17px; line-height: 26px; padding: 0; cursor: pointer; }
  .foto .handle { display: none; position: absolute; right: -9px; bottom: -9px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 2px solid #FFFFFF; cursor: nwse-resize; touch-action: none; }
  .foto.sel .quitar, .foto.sel .handle { display: block; }

  /* ---------- Espiral: los anillos bajan hasta el centro de cada agujero ---------- */
  #holes { position: absolute; left: 0; right: 0; display: grid; grid-template-columns: repeat(14, 1fr); justify-items: center; padding: 0 14px; pointer-events: none; top: 10px; height: 12px; z-index: 1; }
  .hole { width: 12px; height: 12px; border-radius: 50%; background: var(--hole); box-shadow: inset 0 1px 2px rgba(0,0,0,.25); }

  /* ---------- Pendientes con renglón ---------- */
  #lista { position: relative; z-index: 2; list-style: none; margin: 0; padding: 8px 34px 0; }
  .pend { position: relative; border-bottom: 1.5px solid var(--rule); padding: 12px 0 14px; }
  .fila { display: flex; align-items: center; gap: 12px; }
  .chk { flex: none; width: 28px; height: 28px; border: 2px solid var(--claro); border-radius: 50%; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .chk svg { width: 16px; height: 16px; fill: none; stroke: var(--oscuro); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .chk.on { background: var(--claro); border-color: var(--claro); }
  .chk.on svg { opacity: 1; }
  .cuerpo { flex: 1; min-width: 0; cursor: pointer; }
  .texto { font-size: 18px; line-height: 1.35; word-break: break-word; }
  .pend.hecho .texto { text-decoration: line-through; color: var(--soft); }
  .edit-input { width: 100%; border: 0; border-bottom: 2px solid var(--rule); background: transparent; font: inherit; font-size: 18px; color: var(--ink); padding: 2px 0; outline: none; }
  .pop { position: absolute; left: 50%; transform: translateX(-50%); top: 4px; display: flex; gap: 6px; background: #FFFFFF; border: 1.5px solid var(--rule); border-radius: 14px; padding: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.12); z-index: 10; white-space: nowrap; }
  .pop button { border: 0; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; padding: 7px 14px; cursor: pointer; }
  .pop button[data-act="editar"] { background: var(--oscuro); }
  .pop button[data-act="borrar"] { background: var(--claro); }

  .nuevo { position: relative; z-index: 2; padding: 0 34px 28px; }
  .nueva-fila { border-bottom: 1.5px solid var(--rule); padding: 12px 0 14px; }
  .nuevo input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 18px; color: var(--ink); padding: 2px 0; outline: none; }
  .nuevo input::placeholder { color: #B8B2A6; }
  .chk.fantasma { visibility: hidden; pointer-events: none; }
  .nueva-fila.escribiendo .chk.fantasma { visibility: visible; }

</style>
</head>

    <div class="col">
      <label class="ico" id="fotoBtn" aria-label="Agregar foto"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 6l1.5-2h4l1.5 2"/></svg><input type="file" id="fotoIn" accept="image/*" multiple></label>
      <button class="ico" id="palBtn" aria-label="Colores"><svg viewBox="0 0 24 24"><path d="M18.376 2.622a1 1 0 1 1 3.002 3.002L17.36 9.643a.5.5 0 0 0 0 .707l.944.944a2.41 2.41 0 0 1 0 3.408l-.944.944a.5.5 0 0 1-.707 0L8.354 7.348a.5.5 0 0 1 0-.707l.944-.944a2.41 2.41 0 0 1 3.408 0l.944.944a.5.5 0 0 0 .707 0z"/><path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-1 8-4"/></svg></button>
    </div>
  </header>

  <div class="paleta" id="paleta" hidden></div>

  <div id="cuerpo">
  <ul id="lista"></ul>

  <form class="nuevo" id="nuevo" autocomplete="off">
    <div class="fila nueva-fila" id="filaNueva">
      <span class="chk fantasma" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span>
      <input id="entrada" type="text" maxlength="200" placeholder="Escribí un pendiente y dale Enter">
    </div>
  </form>
  </div>

</div>

<script>
(function () {
  const KEY = 'libreta-pendientes-v1';
  const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
  const MAX_FOTOS = 3;

  // ---------- Entrada: tocar la pantalla con el logo lleva a la hoja ----------
  document.getElementById('intro').addEventListener('click', () => {
    document.getElementById('intro').hidden = true;
  });

  // ---------- Datos ----------
  let st = { items: [], dibujos: {}, fotos: {}, colores: null };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && typeof d === 'object') st = { items: d.items || [], dibujos: d.dibujos || {}, fotos: d.fotos || {}, colores: d.colores || null };
    }
  } catch (e) {}
  function guardar() {
    try { localStorage.setItem(KEY, JSON.stringify(st)); }
    catch (e) { alert('No se pudo guardar en este navegador. Puede que no entre más (por ejemplo, fotos muy pesadas).'); }
  }
  const clave = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const soloDia = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const sumarDias = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

  // Lo que no se tacha pasa a la hoja del día siguiente, hasta que se haga.
  // Si se tacha un día, queda tachado ese día y no pasa a la hoja siguiente.
  // Lo que no se tacha pasa solo al día siguiente, y así cada día hasta que se haga.
  // Si se tacha un día, queda tachado ese día y no pasa a la hoja siguiente.
  function visiblesEl(k) {
    return st.items.filter((it) => it.fecha <= k && (!it.hecho || it.hecho >= k));
  }

  // ---------- Colores: oscuro (tilde, cámara, flechas, Editar) y claro (lo demás) ----------
  const ORIGINALES = { claro: '#F6AFCE', oscuro: '#EC268F' };
  const PALETAS = [
    { claro: '#91D8F7', oscuro: '#3E4095' },
    { claro: '#FFCC29', oscuro: '#F5874F' },
    { claro: '#CDD4B2', oscuro: '#889167' },
    { claro: '#F6AFCE', oscuro: '#EC268F' },
    { claro: '#E1C8B2', oscuro: '#A45E4D' }
  ];
  const paleta = document.getElementById('paleta');
  const botonesPaleta = [];
  function aplicarColores() {
    const c = st.colores || ORIGINALES;
    document.documentElement.style.setProperty('--oscuro', c.oscuro);
    document.documentElement.style.setProperty('--claro', c.claro);
    PALETAS.forEach((p, i) => botonesPaleta[i].classList.toggle('sel', p.claro === c.claro && p.oscuro === c.oscuro));
  }
  function elegirPaleta(c) {
    st.colores = { oscuro: c.oscuro, claro: c.claro };
    guardar();
    aplicarColores();
  }
  PALETAS.forEach((c) => {
    const b = document.createElement('button');
    b.className = 'opcion';
    b.setAttribute('aria-label', 'Paleta');
    b.innerHTML = '<span style="background:' + c.claro + '"></span><span style="background:' + c.oscuro + '"></span>';
    b.addEventListener('click', () => elegirPaleta(c));
    botonesPaleta.push(b);
    paleta.appendChild(b);
  });
  const palBtn = document.getElementById('palBtn');
  function cerrarPaleta() { paleta.hidden = true; palBtn.classList.remove('abierto'); }
  palBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    paleta.hidden = !paleta.hidden;
    palBtn.classList.toggle('abierto', !paleta.hidden);
  });
  document.addEventListener('click', (e) => {
    if (!paleta.hidden && !e.target.closest('#paleta, #palBtn')) cerrarPaleta();
  });
  aplicarColores();

  // ---------- Estado de pantalla ----------
  let dia = soloDia(new Date());
  let sel = null;        // pendiente tocado: muestra el pop-up Editar / Borrar
  let editando = null;   // pendiente que se está editando
  let fotoSel = null;    // foto tocada: muestra la cruz y la esquina para agrandar
  const lista = document.getElementById('lista');
  const diaTxt = document.getElementById('diaTxt');
  const mesTxt = document.getElementById('mesTxt');
  const sheet = document.getElementById('sheet');
  const entrada = document.getElementById('entrada');
  const fotosCont = document.getElementById('fotos');

  function render() {
    const k = clave(dia);
    diaTxt.textContent = DIAS[dia.getDay()] + ' ' + dia.getDate();
    mesTxt.textContent = MESES[dia.getMonth()] + ' ' + dia.getFullYear();
    lista.innerHTML = '';
    for (const it of visiblesEl(k)) {
      const hecho = it.hecho === k;
      const seleccionado = sel === it.id;
      const edit = editando === it.id;
      const li = document.createElement('li');
      li.className = 'pend' + (hecho ? ' hecho' : '') + (seleccionado ? ' sel' : '');
      li.dataset.id = it.id;
      li.innerHTML =
        '<div class="fila">' +
          '<button class="chk' + (hecho ? ' on' : '') + '" data-act="tachar" aria-label="Tachar" aria-pressed="' + hecho + '">' + CHECK + '</button>' +
          '<div class="cuerpo"></div>' +
        '</div>';
      const cuerpo = li.querySelector('.cuerpo');
      if (edit) {
        const inp = document.createElement('input');
        inp.className = 'edit-input';
        inp.maxLength = 200;
        inp.value = it.texto;
        cuerpo.appendChild(inp);
      } else {
        const t = document.createElement('div');
        t.className = 'texto';
        t.textContent = it.texto;
        cuerpo.appendChild(t);
      }
      if (seleccionado && !edit) {
        const pop = document.createElement('div');
        pop.className = 'pop';
        pop.innerHTML = '<button data-act="editar">Editar</button><button data-act="borrar">Borrar</button>';
        li.appendChild(pop);
      }
      lista.appendChild(li);
    }
    renderFotos();
    if (editando) {
      const inp = lista.querySelector('.edit-input');
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    }
  }

  function buscar(id) { return st.items.find((x) => x.id === id); }

  function terminarEdicion(guardarCambios) {
    const it = buscar(editando);
    const inp = lista.querySelector('.edit-input');
    editando = null;
    if (it && guardarCambios && inp) {
      const v = inp.value.trim();
      if (v) it.texto = v;
      guardar();
    }
    render();
  }

  // Tocar el circulito tacha (y tocándolo de nuevo destacha).
  // Tocar la palabra abre un pop-up flotante con Editar y Borrar, sin mover los renglones.
  lista.addEventListener('click', (e) => {
    const li = e.target.closest('.pend');
    if (!li) return;
    const id = li.dataset.id;
    const it = buscar(id);
    if (!it) return;
    const act = e.target.closest('[data-act]');
    const accion = act ? act.dataset.act : null;
    if (accion === 'tachar') {
      const k = clave(dia);
      if (it.hecho === k) delete it.hecho; else it.hecho = k;
      guardar();
      render();
      return;
    }
    if (accion === 'editar') { editando = id; sel = null; render(); return; }
    if (accion === 'borrar') {
      st.items = st.items.filter((x) => x !== it);
      sel = null;
      guardar();
      render();
      return;
    }
    if (e.target.closest('.edit-input')) return;
    if (e.target.closest('.cuerpo')) {
      sel = sel === id ? null : id;
      render();
    }
  });

  document.addEventListener('click', (e) => {
    if (sel && !e.target.closest('.pend')) { sel = null; render(); }
  });

  lista.addEventListener('keydown', (e) => {
    if (!e.target.classList.contains('edit-input')) return;
    if (e.key === 'Enter') { e.preventDefault(); terminarEdicion(true); }
    else if (e.key === 'Escape') { e.preventDefault(); terminarEdicion(false); }
  });
  lista.addEventListener('focusout', (e) => {
    if (e.target.classList.contains('edit-input') && editando) terminarEdicion(true);
  });

  // ---------- Agregar pendiente: se escribe en la última línea; se agrega con Enter o al salir ----------
  function agregarDesdeEntrada() {
    const texto = entrada.value.trim();
    if (!texto) return;
    st.items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), texto, fecha: clave(dia) });
    entrada.value = '';
    filaNueva.classList.remove('escribiendo');
    sel = null;
    guardar();
    render();
  }
  const filaNueva = document.getElementById('filaNueva');
  entrada.addEventListener('input', () => filaNueva.classList.toggle('escribiendo', entrada.value.length > 0));
  // Enter: crea el pendiente y deja el cursor en el renglón siguiente, listo para escribir.
  // Se maneja con la tecla (keydown) para que el celular no cierre el teclado.
  entrada.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    agregarDesdeEntrada();
    entrada.focus();
    setTimeout(() => entrada.focus(), 0);
  });
  document.getElementById('nuevo').addEventListener('submit', (e) => { e.preventDefault(); });
  entrada.addEventListener('blur', () => { if (entrada.value.trim()) agregarDesdeEntrada(); });

  // ---------- Cambiar de día: flechas o deslizar ----------
  function irA(nuevoDia) {
    dia = nuevoDia; sel = null; editando = null; fotoSel = null; render(); sheet.scrollTop = 0;
  }
  document.getElementById('prev').addEventListener('click', () => irA(sumarDias(dia, -1)));
  document.getElementById('next').addEventListener('click', () => irA(sumarDias(dia, 1)));

  let tras = false;
  // Cambiar de día con el dedo, en la cabecera: deslizar hacia arriba (día siguiente) o hacia abajo (día anterior).
  // La lista se scrollea normal con el dedo.

  // Al volver a abrir la app (o pasar la medianoche) muestra el día de hoy
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && clave(dia) !== clave(new Date())) irA(soloDia(new Date()));
  });

  // La rueda del mouse solo scrollea la lista. Los días cambian con el dedo (barra de arriba) o las flechas.

  // ---------- Fotos: agregar (hasta 3 por día), mover, agrandar y quitar ----------
  function fotosDelDia() { return st.fotos[clave(dia)] || []; }
  function renderFotos() {
    fotosCont.innerHTML = '';
    for (const f of fotosDelDia()) {
      const d = document.createElement('div');
      d.className = 'foto' + (fotoSel === f.id ? ' sel' : '');
      d.dataset.id = f.id;
      d.style.left = f.x + '%';
      d.style.top = f.y + '%';
      d.style.width = f.w + '%';
      const img = document.createElement('img');
      img.src = f.src;
      img.alt = '';
      img.draggable = false;
      const q = document.createElement('button');
      q.className = 'quitar';
      q.setAttribute('aria-label', 'Quitar foto');
      q.textContent = '×';
      const h = document.createElement('div');
      h.className = 'handle';
      d.append(img, q, h);
      fotosCont.appendChild(d);
    }
  }

  // Lee la foto con FileReader (más compatible que URL.createObjectURL) y la achica
  function comprimir(file) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onerror = () => reject(new Error('lectura'));
      lector.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('imagen'));
        img.onload = () => {
          const max = 900;
          const esc = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * esc));
          c.height = Math.max(1, Math.round(img.height * esc));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.src = lector.result;
      };
      lector.readAsDataURL(file);
    });
  }

  const fotoIn = document.getElementById('fotoIn');
  fotoIn.addEventListener('change', async () => {
    const k = clave(dia);
    const archivos = Array.from(fotoIn.files || []);
    fotoIn.value = '';
    if (!archivos.length) return;
    const libres = MAX_FOTOS - fotosDelDia().length;
    if (libres <= 0) { alert('Ya hay ' + MAX_FOTOS + ' fotos en este día. Quitá una para poner otra.'); return; }
    let fallas = 0;
    for (const file of archivos.slice(0, libres)) {
      try {
        const src = await comprimir(file);
        const n = (st.fotos[k] || []).length;
        (st.fotos[k] = st.fotos[k] || []).push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), src, x: 14 + n * 8, y: 45 + n * 8, w: 42 });
      } catch (e) { fallas++; }
    }
    if (fallas) alert('No pude cargar ' + (fallas === 1 ? 'esa foto' : 'algunas fotos') + '. Probá con otra.');
    guardar();
    render();
  });

  let arrastreFoto = null;
  document.addEventListener('pointerdown', (e) => {
    const quitar = e.target.closest('.foto .quitar');
    if (quitar) {
      const id = quitar.parentElement.dataset.id;
      st.fotos[clave(dia)] = fotosDelDia().filter((f) => f.id !== id);
      fotoSel = null;
      guardar();
      render();
      return;
    }
    const fe = e.target.closest('.foto');
    if (!fe) {
      if (fotoSel) { fotoSel = null; renderFotos(); }
      return;
    }
    const f = fotosDelDia().find((x) => x.id === fe.dataset.id);
    if (!f) return;
    fotoSel = f.id;
    renderFotos();
    const esHandle = e.target.classList.contains('handle');
    arrastreFoto = { f, modo: esHandle ? 'agrandar' : 'mover', sx: e.clientX, sy: e.clientY, ox: f.x, oy: f.y, ow: f.w, W: sheet.clientWidth, H: sheet.clientHeight };
    e.preventDefault();
  });
  document.addEventListener('pointermove', (e) => {
    if (!arrastreFoto) return;
    const a = arrastreFoto;
    const dx = (e.clientX - a.sx) / a.W * 100;
    const dy = (e.clientY - a.sy) / a.H * 100;
    if (a.modo === 'mover') {
      a.f.x = Math.max(-5, Math.min(90, a.ox + dx));
      a.f.y = Math.max(0, Math.min(92, a.oy + dy));
    } else {
      a.f.w = Math.max(14, Math.min(95, a.ow + dx));
    }
    const el = fotosCont.querySelector('[data-id="' + a.f.id + '"]');
    if (el) { el.style.left = a.f.x + '%'; el.style.top = a.f.y + '%'; el.style.width = a.f.w + '%'; }
  });
  document.addEventListener('pointerup', () => {
    if (!arrastreFoto) return;
    arrastreFoto = null;
    guardar();
  });

  // ---------- Espiral y agujeros ----------
  const agujeros = document.getElementById('holes');
  for (let i = 0; i < 14; i++) {
    const h = document.createElement('div'); h.className = 'hole'; agujeros.appendChild(h);
  }

  render();
})();
</script>
</body>
</html>
